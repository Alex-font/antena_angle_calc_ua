<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор кута антени</title>
  
  <!-- Підключення PWA маніфесту та іконки -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      padding: 8px 12px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 20px;
      padding: 16px 14px 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(16px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(74, 222, 128, 0.5);
      color: #bbf7d0;
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.2), rgba(8, 47, 73, 0.5));
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle-unit {
      display: block;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      color: #9ca3af;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .field {
      position: relative;
    }

    input {
      width: 100%;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #6b7280;
      font-size: 0.78rem;
    }

    input:focus {
      border-color: rgba(96, 165, 250, 1);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.6);
      background: rgba(15, 23, 42, 1);
    }

    .unit {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72rem;
      color: #6b7280;
      pointer-events: none;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      font-size: 0.68rem;
      color: #9ca3af;
      cursor: pointer;
      white-space: nowrap;
    }

    .checkbox-row input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #60a5fa;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 4px;
    }

    .btn-secondary {
      padding: 4px 10px;
      font-size: 0.72rem;
      background: rgba(15, 23, 42, 0.8);
      color: #9ca3af;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: rgba(31, 41, 55, 0.9);
    }

    .result {
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 14px;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), rgba(15, 23, 42, 0.96));
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .result-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }

    .angle-value {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .angle-unit {
      font-size: 0.82rem;
      color: #9ca3af;
    }

    .result-note {
      font-size: 0.75rem;
      color: #d1d5db;
      line-height: 1.3;
    }

    .helper {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="header">
      <div class="title">Калькулятор кута антени</div>
      <div class="badge">FPV / РЕБ</div>
    </div>
    <p class="subtitle">
      Кут нахилу розраховується автоматично.
      <span class="subtitle-unit">Одиниця виміру — Метри.</span>
    </p>

    <div class="grid">
      <div>
        <label for="distance">Дистанція до цілі:</label>
        <div class="field">
          <input id="distance" type="number" step="0.01" placeholder="4680" />
          <div class="unit">м</div>
        </div>
      </div>
      <div>
        <label for="targetHeight">Висота цілі:</label>
        <div class="field">
          <input id="targetHeight" type="number" step="0.1" placeholder="2300" />
          <div class="unit">м</div>
        </div>
      </div>
      <div>
        <label for="antennaHeight">Висота антени:</label>
        <div class="field">
          <input id="antennaHeight" type="number" step="0.1" placeholder="2" />
          <div class="unit">м</div>
        </div>
        <label class="checkbox-row">
          <input id="earthCurvature" type="checkbox" checked />
          <span>Враховувати кривизну Землі</span>
        </label>
      </div>
    </div>

    <div class="button-row">
      <button class="btn-secondary" type="button" onclick="resetFields()">
        Скинути
      </button>
    </div>

    <div id="result" class="result" style="display:none;">
      <div class="result-main">
        <div id="angleValue" class="angle-value">0.0</div>
        <div class="angle-unit">°</div>
      </div>
      <div id="resultNote" class="result-note"></div>
    </div>

    <div class="helper">
      <span>Формула: кут з урахуванням кривизни Землі.</span>
    </div>
  </div>

  <script>
    const distanceInput = document.getElementById('distance');
    const targetInput = document.getElementById('targetHeight');
    const antennaInput = document.getElementById('antennaHeight');
    const earthCurvatureInput = document.getElementById('earthCurvature');
    const resultBlock = document.getElementById('result');
    const angleValue = document.getElementById('angleValue');
    const resultNote = document.getElementById('resultNote');
    const card = document.getElementById('card');

    function calculateAngle() {
      const distanceVal = distanceInput.value.trim();
      const targetVal = targetInput.value.trim();
      const antennaVal = antennaInput.value.trim();

      if (distanceVal === '' || targetVal === '' || antennaVal === '') {
        resultBlock.style.display = 'none';
        return;
      }

      const distance = parseFloat(distanceVal.replace(',', '.'));
      const targetHeight = parseFloat(targetVal.replace(',', '.'));
      const antennaHeight = parseFloat(antennaVal.replace(',', '.'));

      if (!isFinite(distance) || distance <= 0 || !isFinite(targetHeight) || !isFinite(antennaHeight)) {
        resultBlock.style.display, (resultBlock.style.display = 'none');
        return;
      }

      let angleDeg;
      let curvatureDrop = 0;

      if (earthCurvatureInput.checked) {
        // Середній радіус Землі, м.
        const EARTH_RADIUS = 6371000;

        // "Дистанція до цілі" вважається відстанню по поверхні Землі.
        const centralAngle = distance / EARTH_RADIUS;

        // Радіуси від центра Землі до антени та цілі.
        const rAntenna = EARTH_RADIUS + antennaHeight;
        const rTarget = EARTH_RADIUS + targetHeight;

        // Точний сферичний розрахунок кута від локального горизонту антени.
        const horizontalComponent =
          rTarget * Math.sin(centralAngle);

        const verticalComponent =
          rTarget * Math.cos(centralAngle) - rAntenna;

        const angleRad = Math.atan2(verticalComponent, horizontalComponent);
        angleDeg = angleRad * 180 / Math.PI;

        // Наскільки поверхня Землі "опускається" на цій дистанції.
        curvatureDrop =
          EARTH_RADIUS * (1 - Math.cos(centralAngle));
      } else {
        // Старий розрахунок без кривизни Землі.
        const deltaH = targetHeight - antennaHeight;
        angleDeg = Math.atan(deltaH / distance) * 180 / Math.PI;
      }

      const rounded = Math.round(angleDeg * 10) / 10;
      angleValue.textContent = rounded.toFixed(1);

      let note = '';
      if (rounded > 0) {
        note = 'Підніми антену на ' + rounded.toFixed(1) + '° від горизонту.';
      } else if (rounded < 0) {
        const abs = Math.abs(rounded);
        note = 'Опусти антену на ' + abs.toFixed(1) + '° від горизонту.';
      } else {
        note = 'Антена точно по горизонту (0°).';
      }

      note += ' ΔH = ' + (targetHeight - antennaHeight).toFixed(1) +
        ' м, D = ' + distance.toFixed(1) + ' м.';

      if (earthCurvatureInput.checked) {
        note += ' Кривизна Землі ≈ ' + curvatureDrop.toFixed(1) + ' м.';
      }

      resultNote.textContent = note;
      resultBlock.style.display = 'block';

      setTimeout(() => {
        resultBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }

    function resetFields() {
      distanceInput.value = '';
      targetInput.value = '';
      antennaInput.value = '';
      earthCurvatureInput.checked = true;
      resultBlock.style.display = 'none';
      distanceInput.focus();
    }

    distanceInput.addEventListener('input', calculateAngle);
    targetInput.addEventListener('input', calculateAngle);
    antennaInput.addEventListener('input', calculateAngle);
    earthCurvatureInput.addEventListener('change', calculateAngle);

    const inputs = [distanceInput, targetInput, antennaInput];
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
      });
    });
  </script>
</body>
</html>
